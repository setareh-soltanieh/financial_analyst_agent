[project]
name = "financial-analyst-agent"
version = "0.1.0"
description = "MCP-powered financial research agent for public-company analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "autoevals>=0.3.0",
    "braintrust>=0.34.0",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "openai>=3.3.1",
    "python-dotenv>=1.2.3",
    "sec-edgar-mcp>=1.0.8",
]

[project.scripts]
financial-analyst-agent = "financial_analyst_agent.cli:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "autoevals>=0.3.0",
    "braintrust>=0.34.0",
]
